<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Emulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }
    #root { height: 100vh; display: flex; flex-direction: column; }
    /* Titlebar drag region */
    .titlebar {
      height: 32px;
      background: #141414;
      display: flex;
      align-items: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      user-select: none;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    .titlebar span {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      -webkit-app-region: no-drag;
    }
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #ue-loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 16, 23, .68);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    #ue-loading-overlay.is-open { opacity: 1; pointer-events: all; }
    .ue-loading-card {
      width: min(360px, 86vw);
      padding: 26px 28px;
      border: 1px solid rgba(134, 164, 205, .45);
      border-radius: 18px;
      background: rgba(31, 39, 53, .96);
      box-shadow: 0 22px 70px rgba(0,0,0,.38);
      text-align: center;
    }
    .ue-loading-card strong { display: block; margin-top: 13px; color: #f3f6fb; letter-spacing: .12em; font-size: 13px; }
    .ue-loading-card span { display: block; margin-top: 8px; color: #aebbd0; font-size: 11px; }
    .ue-loading-spinner {
      width: 34px; height: 34px; margin: 0 auto; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.2); border-top-color: #5da2ff;
      animation: ue-loading-spin .8s linear infinite;
    }
    .ue-progress-track { height: 6px; margin-top: 18px; overflow: hidden; border-radius: 99px; background: #111923; }
    .ue-progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,#438fff,#8cc4ff); transition: width .2s ease; }
    .ue-progress-bar.indeterminate { width: 42%; animation: ue-loading-progress 1.25s ease-in-out infinite; }
    @keyframes ue-loading-spin { to { transform: rotate(360deg); } }
    @keyframes ue-loading-progress { 0% { transform: translateX(-120%); } 100% { transform: translateX(310%); } }
    #ue-loading-overlay.is-open ~ * { }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="ue-loading-overlay" aria-live="polite" aria-busy="false">
    <div class="ue-loading-card">
      <div class="ue-loading-spinner" aria-hidden="true"></div>
      <strong>CARREGANDO...</strong>
      <span id="ue-loading-detail">Preparando o Ultimate Emulator</span>
      <div class="ue-progress-track"><div id="ue-loading-progress" class="ue-progress-bar indeterminate"></div></div>
    </div>
  </div>
  <script src="app.js"></script>
  <!-- Versioned URL prevents Chromium from reusing an old in-memory visual
       stylesheet after the packed app has been updated. -->
  <script src="windows-design.js?v=20261028-light-contrast-2"></script>
  <script src="sidebar-resize.js"></script>
  <script src="hero-collapse.js"></script>
</body>
</html>
