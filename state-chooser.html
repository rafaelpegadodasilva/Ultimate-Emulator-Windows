<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escolher save state</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #f5f5f5; user-select: none; }
    #state-overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 28px; background: rgba(0,0,0,.74);
    }
    #state-panel {
      width: min(980px, calc(100vw - 56px)); max-height: min(760px, calc(100vh - 56px));
      display: flex; flex-direction: column; gap: 16px; padding: 22px;
      border: 1px solid rgba(255,255,255,.24); border-radius: 18px;
      background: rgba(27,27,29,.98); box-shadow: 0 20px 80px rgba(0,0,0,.7);
    }
    #state-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    #state-head strong { display: block; font-size: 17px; letter-spacing: .09em; }
    #state-head small { display: block; margin-top: 5px; color: #b7b7b7; font-size: 12px; }
    #state-close { width: 35px; height: 35px; border: 1px solid #666; border-radius: 10px; background: #242426; color: #fff; font-size: 23px; line-height: 1; cursor: pointer; }
    #state-close:hover { background: #3a3a3d; }
    #state-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; overflow: auto; padding: 2px 3px 8px; }
    .state-card { min-width: 0; padding: 8px; border: 1px solid #414143; border-radius: 12px; background: #202023; color: #eee; text-align: left; cursor: pointer; }
    .state-card:hover, .state-card.selected { border-color: #e9e9e9; background: #303033; box-shadow: 0 0 0 1px rgba(255,255,255,.16); }
    .state-card.latest, .state-card.latest.selected, .state-card.latest:hover {border-color:#73f3a6;background:#163c29;box-shadow:0 0 0 2px #4ddb8755;}
    .state-card.latest strong, .state-card.latest small {color:#9affbd;}
    .latest-badge {display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:#98ffb9;margin-bottom:7px;}
    .state-thumb { height: 104px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #111113; color: #8f8f92; font-size: 11px; }
    .state-thumb img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .state-card strong { display: block; margin-top: 8px; font-size: 13px; }
    .state-card small { display: block; margin-top: 4px; color: #bdbdc0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #state-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #bdbdc0; font-size: 12px; }
    #state-cancel { padding: 9px 15px; border: 1px solid #68686b; border-radius: 9px; background: #2c2c2f; color: #fff; cursor: pointer; }
    #state-cancel:hover { background: #404044; }
    #state-toast {
      position: fixed; top: 24px; left: 24px; display: none; z-index: 10;
      max-width: min(360px, calc(100vw - 48px)); padding: 9px 13px;
      border-left: 3px solid #d7d7d7; border-radius: 6px;
      background: rgba(22,22,24,.92); color: #f2f2f2;
      box-shadow: 0 8px 24px rgba(0,0,0,.38); font-size: 15px;
      line-height: 1.25; font-weight: 600; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="state-overlay" role="dialog" aria-modal="true" aria-label="Escolher save state">
    <section id="state-panel">
      <div id="state-head">
        <div><strong>ESCOLHER SAVE STATE</strong><small>O jogo está pausado · clique uma vez na miniatura para carregar</small></div>
        <button id="state-close" type="button" aria-label="Cancelar">×</button>
      </div>
      <div id="state-grid" role="listbox" aria-label="Saves disponíveis"></div>
      <div id="state-footer"><span id="state-status">Selecione um save</span><button id="state-cancel" type="button">Cancelar</button></div>
    </section>
  </div>
  <div id="state-toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const overlay = document.getElementById('state-overlay');
      const grid = document.getElementById('state-grid');
      const status = document.getElementById('state-status');
      const closeButton = document.getElementById('state-close');
      const cancelButton = document.getElementById('state-cancel');
      const toast = document.getElementById('state-toast');
      let states = [];
      let selected = 0;
      let busy = false;
      let pollTimer = null;
      let previousButtons = [];
      let gamepadNeutral = false;
      let toastTimer = null;
      let lastMoveAt = 0;

      const showToast = payload => {
        const message = String(payload?.message || '');
        if (!message) return;
        toast.textContent = message;
        toast.style.display = 'block';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.style.display = 'none';
          window.electronAPI.ue10StateToastClosed?.().catch?.(() => {});
        }, 1600);
      };

      const formatDate = value => {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? 'Data não disponível' : date.toLocaleString('pt-BR');
      };
      const pressed = (pad, index) => Boolean(pad && pad.buttons && pad.buttons[index] && pad.buttons[index].pressed);
      const anyNavigation = pad => Boolean(
        pressed(pad, 0) || pressed(pad, 1) || pressed(pad, 10) || pressed(pad, 11) || pressed(pad, 12) || pressed(pad, 13) || pressed(pad, 14) || pressed(pad, 15) ||
        Math.abs(Number(pad?.axes?.[0] || 0)) > .45 || Math.abs(Number(pad?.axes?.[1] || 0)) > .45
      );
      const choose = async () => {
        if (busy || !states[selected]) return;
        busy = true;
        status.textContent = 'Carregando save…';
        try {
          const result = await window.electronAPI.ue10StateAction({action:'LOAD_STATE_SLOT', id:states[selected].id});
          if (!result || !result.ok) {
            busy = false;
            status.textContent = result?.error || 'Não foi possível carregar este save.';
            return;
          }
          closeUi();
        } catch (error) {
          busy = false;
          status.textContent = error?.message || 'Falha ao carregar o save.';
        }
      };
      const cancel = async () => {
        if (busy) return;
        busy = true;
        try { await window.electronAPI.ue10StateAction({action:'CANCEL_LOAD_STATE'}); } catch (_) {}
        closeUi();
      };
      const paint = () => {
        [...grid.children].forEach((card, index) => {
          card.classList.toggle('selected', index === selected);
          card.setAttribute('aria-selected', String(index === selected));
        });
        status.textContent = `${selected + 1} / ${states.length}`;
        grid.children[selected]?.scrollIntoView({block:'nearest', inline:'nearest'});
      };
      const columns = () => Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length);
      const move = delta => {
        if (busy || !states.length) return;
        selected = (selected + delta + states.length) % states.length;
        paint();
      };
      const closeUi = () => {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        document.removeEventListener('keydown', onKey, true);
        window.electronAPI.ue10StateModalClosed().catch?.(() => {});
        overlay.style.display = 'none';
        grid.replaceChildren();
        states = [];
        busy = false;
      };
      const onKey = event => {
        if (event.key === 'Escape') { event.preventDefault(); cancel(); return; }
        if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') { event.preventDefault(); move(event.key === 'ArrowUp' ? -columns() : -1); return; }
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') { event.preventDefault(); move(event.key === 'ArrowDown' ? columns() : 1); return; }
        if (event.key === 'Enter' || event.key.toLowerCase() === 'x') { event.preventDefault(); choose(); }
      };
      const startGamepad = () => {
        if (pollTimer) clearInterval(pollTimer);
        previousButtons = [];
        gamepadNeutral = false;
        pollTimer = setInterval(() => {
          const pad = [...(navigator.getGamepads?.() || [])].find(item => item && item.connected);
          if (!pad) return;
          if (!gamepadNeutral) {
            if (anyNavigation(pad)) return;
            gamepadNeutral = true;
            previousButtons = [];
            return;
          }
          const current = (pad.buttons || []).map(button => Boolean(button?.pressed));
          const edge = index => current[index] && !previousButtons[index];
          const now = Date.now();
          const x = Number(pad.axes?.[0] || 0), y = Number(pad.axes?.[1] || 0);
          const direction = edge(14) ? -1 : edge(15) ? 1 : edge(12) ? -columns() : edge(13) ? columns() :
            now - lastMoveAt >= 220 ? (Math.abs(y) > .55 ? Math.sign(y) * columns() : Math.abs(x) > .55 ? Math.sign(x) : 0) : 0;
          if (direction) { move(direction); lastMoveAt = now; }
          if (edge(1)) cancel();
          else if (edge(0)) choose();
          previousButtons = current;
        }, 80);
      };
      const open = payload => {
        states = Array.isArray(payload?.states) ? payload.states : [];
        if (states.length < 2) return;
        if (toastTimer) clearTimeout(toastTimer);
        toast.style.display = 'none';
        selected = 0; busy = false; grid.replaceChildren();
        states.forEach((record, index) => {
          const card = document.createElement('button');
          card.type = 'button'; card.className = 'state-card'+(index===0?' latest':''); card.setAttribute('role','option');
          const thumb = document.createElement('div'); thumb.className = 'state-thumb';
          if (record.thumbnailUrl) {
            const image = document.createElement('img'); image.src = record.thumbnailUrl; image.alt = 'Miniatura do save'; image.loading = 'eager';
            image.onerror = () => { image.remove(); thumb.textContent = 'SEM MINIATURA'; };
            thumb.appendChild(image);
          } else thumb.textContent = record.legacy ? 'SAVE ANTIGO' : 'SEM MINIATURA';
          const label = document.createElement('strong'); label.textContent = Number.isInteger(record.slot) ? `Save ${record.slot + 1}` : 'Save antigo';
          const date = document.createElement('small'); date.textContent = formatDate(record.createdAt);
          if(index===0){const badge=document.createElement('span');badge.className='latest-badge';badge.textContent='ÚLTIMO SAVE';card.append(badge);}
          card.append(thumb, label, date);
          card.addEventListener('click', () => { selected = index; paint(); choose(); });
          grid.appendChild(card);
        });
        overlay.style.display = 'flex';
        document.addEventListener('keydown', onKey, true);
        paint(); startGamepad();
      };
      closeButton.addEventListener('click', cancel);
      cancelButton.addEventListener('click', cancel);
      overlay.addEventListener('pointerdown', event => { if (event.target === overlay) cancel(); });
      window.electronAPI.ue10OnStateChooser(open);
      window.electronAPI.ue10OnStateToast?.(showToast);
    })();
  </script>
</body>
</html>
