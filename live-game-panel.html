<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Filtros e cheats</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px "Segoe UI",sans-serif;color:#f3f3f3;background:transparent}body{padding:10px}.panel{height:100%;display:flex;flex-direction:column;border:1px solid #777;border-radius:18px;background:rgba(24,24,27,.94);box-shadow:0 12px 45px #0009;overflow:hidden}header{padding:21px 24px 15px;border-bottom:1px solid #49494c}h1{font-size:21px;margin:0 0 5px}small{color:#bdbdc6}h2{font-size:14px;margin:0 0 12px;letter-spacing:.05em}.tabs{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid #49494c;background:#202023}.tab{padding:9px 13px;border-radius:9px;background:#29292d;border:1px solid #505057;font-weight:650}.tab.active{background:#47474f;border-color:#b7d5ff}.view{display:flex;flex:1;min-height:0}.view[hidden]{display:none!important}.body{display:grid;grid-template-columns:225px minmax(0,1fr);flex:1;min-height:0}aside{padding:20px 16px;overflow:auto;border-right:1px solid #49494c}main{padding:20px;overflow:auto;min-width:0}button,input,select{font:inherit;color:inherit;background:#2b2b2f;border:1px solid #626268;border-radius:8px;padding:10px}input::placeholder{color:#8d8d95;opacity:1}button{cursor:pointer}button:hover{background:#414147}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7d5ff;outline-offset:2px}.filter{display:block;width:100%;margin-bottom:8px;text-align:left}.filter.active{border-color:white;background:#4a4a53}.filter.active:before{content:'✓ ';color:white}.cheat{border:1px solid #48484e;border-radius:10px;padding:12px;margin:10px 0;background:#242428}.cheat label{display:flex;align-items:center;gap:12px;cursor:pointer}.cheat input[type=checkbox]{width:21px;height:21px;accent-color:#b7d5ff}.cheat select,.cheat input[type=number]{margin-top:9px;max-width:100%}.cheat small{display:block;margin-top:7px}#search{width:100%;margin-bottom:10px}.config-view{padding:20px;overflow:auto;display:block;width:100%}.config-note{color:#bdbdc6;line-height:1.55;margin:0 0 14px}.map-grid{display:grid;grid-template-columns:110px minmax(130px,1fr) minmax(120px,1fr);gap:7px;align-items:center}.map-grid>strong{font-size:12px;color:#d9d9df}.map-grid input,.map-grid select{width:100%;min-width:0}.map-capture{padding:8px;font-size:12px}.state-actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.state-actions button{min-width:180px}.state-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0}.state-thumb-card{background:#242428;border:1px solid #49494f;border-radius:10px;padding:7px;text-align:left;cursor:pointer;color:#f3f3f3}.state-thumb-card:hover,.state-thumb-card:focus-visible{border-color:#b7d5ff;background:#303038}.state-thumb{width:100%;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;border-radius:7px;background:#111}.state-thumb img{width:100%;height:100%;object-fit:contain;display:block}.state-thumb.empty{color:#9da0aa;font-size:11px;text-align:center}.state-thumb-card strong,.state-thumb-card small{display:block;margin-top:6px}.state-card{border:1px solid #49494f;border-radius:10px;background:#242428;padding:14px;line-height:1.55}.state-card strong{display:block;margin-bottom:5px}.state-card small{display:block;color:#bdbdc6}.state-card button{margin-top:10px}footer{display:flex;align-items:center;gap:16px;padding:14px 22px;border-top:1px solid #49494c;background:#222226}#status{flex:1;font-size:12px;line-height:1.4;color:#c8d8f1;min-height:34px}#ok{min-width:125px;background:#e4e4eb;color:#16161c;font-weight:700}button:disabled{opacity:.5;cursor:wait}.empty{line-height:1.6;color:#bbb}#note{display:block;line-height:1.5;margin-top:15px;font-size:12px}@media(max-width:650px){.body{grid-template-columns:185px minmax(0,1fr)}main{padding:12px}.map-grid{grid-template-columns:1fr 1fr}.map-grid>strong{grid-column:1 / -1}}
</style></head><body><section class="panel" role="dialog" aria-modal="true" aria-label="Ferramentas do jogo atual"><header><h1 id="title">Ferramentas do jogo</h1><small id="subtitle">Alterações em tempo real · OK ou Ctrl+K confirma e volta ao jogo</small></header><nav id="tabs" class="tabs" aria-label="Ferramentas"></nav><div id="filters-view" class="view"><div class="body"><aside><h2>FILTROS</h2><div id="filters"></div><small id="note">Selecione para visualizar imediatamente no jogo.</small></aside><main><h2>CHEATS DESTE JOGO</h2><input type="search" id="search" placeholder="Buscar vidas, energia, tempo…" aria-label="Buscar cheats"><div id="items"></div></main></div></div><div id="controls-view" class="view config-view" hidden></div><div id="states-view" class="view config-view" hidden></div><footer><span id="status" role="status">Conectando ao jogo…</span><button id="ok">OK · voltar</button></footer></section><script>
(()=>{
 const api=window.electronAPI,$=id=>document.getElementById(id);
 const actions=[['up','Cima'],['down','Baixo'],['left','Esquerda'],['right','Direita'],['a','A'],['b','B'],['x','X'],['y','Y'],['start','Start'],['select','Select'],['l','L1'],['r','R1'],['l2','L2'],['r2','R2']];
 const keyNames=['','up','down','left','right','z','x','a','s','q','w','d','enter','rshift','lshift','space','tab','escape','c','v','f','g','1','2','3','5','6','8','0'];
 let data=null,closing=false,operations=0,neutral=false,previous=[],lastMove=0,selectedFilter='off',activeTab='filters',options=null,capturing=null;
 const setStatus=text=>$('status').textContent=text;
 function markFilter(){for(const b of $('filters').children){b.classList.toggle('active',b.dataset.value===selectedFilter);b.setAttribute('aria-pressed',String(b.dataset.value===selectedFilter));}}
 async function filter(value){if(closing)return;operations++;selectedFilter=value;markFilter();setStatus('Aplicando filtro ao jogo…');try{const r=await api.ueLiveFilter(value);if(!r.ok){selectedFilter=data.selected;markFilter();setStatus(r.error||'Filtro não confirmado.');}else{data.selected=value;setStatus('Filtro aplicado. OK mantém esta escolha.');}}catch(e){setStatus(e.message);}finally{operations--;}}
 async function cheat(entry,request,control){if(closing)return;operations++;control.disabled=true;setStatus('Aplicando cheat neste jogo…');try{const r=await api.ueLiveCheat(entry.index,request);if(r.ok){entry.enabled=!!r.enabled;if(r.value!==undefined)entry.value=r.value;setStatus(r.message||'Cheat aplicado ao jogo.');}else{setStatus(r.error||'Cheat não confirmado.');}if(control.type==='checkbox')control.checked=!!entry.enabled;}catch(e){setStatus(e.message);}finally{control.disabled=false;operations--;}}
 function cheats(){const query=$('search').value.toLocaleLowerCase('pt-BR');$('items').replaceChildren();let count=0;for(const entry of data.entries||[]){if(!entry.name.toLocaleLowerCase('pt-BR').includes(query))continue;count++;const row=document.createElement('article');row.className='cheat';const label=document.createElement('label'),text=document.createElement('span');text.textContent=entry.name;const check=document.createElement('input');check.type='checkbox';check.checked=!!entry.enabled;check.disabled=!entry.actionable;if(!entry.oneshot)label.append(check);label.append(text);row.append(label);let value;
 if(entry.parameter){const values=entry.parameter.item?Object.values(entry.parameter.item):null;value=document.createElement(values?'select':'input');if(values){for(const item of values){const o=document.createElement('option');o.value=item.value;o.textContent=item.text;value.append(o);}}else{value.type='number';value.min=entry.parameter.min;value.max=entry.parameter.max;value.step=entry.parameter.step||1;}value.value=entry.value??values?.[0]?.value??entry.parameter.min;value.setAttribute('aria-label','Valor de '+entry.name);value.onchange=()=>{entry.value=Number(value.value);if(entry.enabled)cheat(entry,{enabled:true,value:entry.value},value);};row.append(value);}
 check.onchange=()=>cheat(entry,value?{enabled:check.checked,value:Number(value.value)}:check.checked,check);
 if(entry.oneshot){const b=document.createElement('button');b.textContent='Aplicar uma vez';b.disabled=!entry.actionable;b.onclick=()=>cheat(entry,{enabled:true,value:value?Number(value.value):undefined},b);row.append(b);}if(!entry.actionable){const note=document.createElement('small');note.textContent='Informação / grupo de códigos';row.append(note);}$('items').append(row);}
 if(!count){const p=document.createElement('p');p.className='empty';p.textContent=data.entries?.length?'Nenhum resultado para esta busca.':(data.reason||'Nenhum cheat compatível encontrado para este jogo na base instalada.');$('items').append(p);}}
 function tabButton(id,label){const b=document.createElement('button');b.type='button';b.className='tab'+(activeTab===id?' active':'');b.textContent=label;b.onclick=()=>showTab(id);return b;}
 function showTab(id){if(data?.kind==='mame'&&id!=='filters')return;activeTab=id;for(const view of ['filters','controls','states'])$(view+'-view').hidden=view!==id;$('tabs').replaceChildren(tabButton('filters','Filtros + cheats'));if(data?.kind!=='mame'){$('tabs').append(tabButton('controls','Controles'),tabButton('states','Save states'));}if(id==='controls')renderControls();if(id==='states')renderStates();}
 function makeSelect(options,value){const select=document.createElement('select');for(const [v,label] of options){const option=document.createElement('option');option.value=v;option.textContent=label;select.append(option);}select.value=String(value??'');return select;}
 function keyInput(action,label){const input=document.createElement('input');input.readOnly=true;input.value=options?.keys?.[action]||'';input.placeholder='Clique e pressione';input.setAttribute('aria-label','Teclado '+label);input.onkeydown=e=>{e.preventDefault();const special={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'enter',Space:'space',Tab:'tab',Escape:'escape'};const key=special[e.key]||(/^Key[A-Z]$/.test(e.code)?e.code.slice(3).toLowerCase():/^Digit\d$/.test(e.code)?e.code.slice(5):'');if(!key)return;if(['7','9','space','f11'].includes(key)){setStatus('Essa tecla é reservada para os atalhos do emulador.');return;}options.keys=options.keys||{};options.keys[action]=key;setStatus(label+' → '+key+' (salve para aplicar).');};return input;}
 function renderControls(){const view=$('controls-view');view.replaceChildren();if(!options){view.append(Object.assign(document.createElement('p'),{className:'config-note',textContent:'Lendo o perfil de controles…'}));api.ue6ReadOptions(data.systemFolder).then(v=>{options=v||{};renderControls();}).catch(e=>setStatus(e.message));return;}const note=document.createElement('p');note.className='config-note';note.textContent='Perfil do RetroArch deste sistema. Clique no campo de teclado ou em Capturar e salve; a alteração vale na próxima abertura do jogo.';view.append(note);const grid=document.createElement('div');grid.className='map-grid';grid.append(Object.assign(document.createElement('strong'),{textContent:'Ação'}),Object.assign(document.createElement('strong'),{textContent:'Teclado'}),Object.assign(document.createElement('strong'),{textContent:'Joystick'}));for(const [action,label] of actions){const name=document.createElement('strong');name.textContent=label;const key=keyInput(action,label);const choices=[['','Automático']];for(let i=0;i<24;i++)choices.push([String(i),'Botão '+i]);const pad=makeSelect(choices,options.buttons?.[action]??'');pad.setAttribute('aria-label','Joystick '+label);pad.onchange=()=>{options.buttons=options.buttons||{};if(pad.value==='')delete options.buttons[action];else options.buttons[action]=pad.value;};grid.append(name,key,pad);}view.append(grid);const save=document.createElement('button');save.textContent='Salvar controles deste sistema';save.onclick=async()=>{save.disabled=true;try{await api.ue6SaveOptions({...options,folder:data.systemFolder,keys:options.keys||{},buttons:options.buttons||{}});setStatus('Controles salvos para '+data.systemFolder+'. Serão usados na próxima partida.');}catch(e){setStatus(e.message);}finally{save.disabled=false;}};view.append(save);}
 async function stateAction(action){if(closing)return;operations++;setStatus(action==='SAVE_STATE'?'Salvando estado…':'Abrindo saves…');try{const r=await api.ue10StateAction(action);if(r?.choose)setStatus('Escolha um save na janela de miniaturas.');else setStatus(r?.ok?(action==='SAVE_STATE'?'Save state salvo.':'Save state carregado.'):(r?.error||'Não foi possível executar o comando.'));}catch(e){setStatus(e.message);}finally{operations--;}}
 async function renderStates(){const view=$('states-view');view.replaceChildren();const note=document.createElement('p');note.className='config-note';note.textContent='Selecione uma miniatura para carregar este save state.';view.append(note);const save=document.createElement('button');save.textContent='Salvar novo estado · 7';save.onclick=async()=>{await stateAction('SAVE_STATE');setTimeout(renderStates,250);};view.append(save);let status;try{status=await api.ue10StateStatus();}catch(e){const error=document.createElement('p');error.className='config-note';error.textContent=e.message;view.append(error);return;}const states=Array.isArray(status?.states)?status.states:[];if(!states.length){const empty=document.createElement('p');empty.className='config-note';empty.textContent='Este jogo ainda não possui save states.';view.append(empty);return;}const grid=document.createElement('div');grid.className='state-grid';for(const record of states){const card=document.createElement('button');card.type='button';card.className='state-thumb-card';const art=document.createElement('div');art.className='state-thumb';if(record.thumbnailUrl){const image=document.createElement('img');image.src=record.thumbnailUrl;image.alt='Miniatura do save state';image.onerror=()=>{image.remove();art.classList.add('empty');art.textContent='SEM MINIATURA';};art.append(image);}else{art.classList.add('empty');art.textContent=record.legacy?'SAVE ANTIGO':'SEM MINIATURA';}const label=document.createElement('strong');label.textContent=Number.isInteger(record.slot)?'Save '+(record.slot+1):'Save antigo';const date=document.createElement('small');try{date.textContent=new Date(record.createdAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){date.textContent='';}card.append(art,label,date);card.onclick=async()=>{if(closing||operations)return;operations++;card.disabled=true;setStatus('Carregando save state…');try{const result=await api.ue10StateAction({action:'LOAD_STATE_SLOT',id:record.id});if(result?.ok){setStatus('Save carregado.');setTimeout(confirm,250);}else{setStatus(result?.error||'Não foi possível carregar este save.');card.disabled=false;}}catch(e){setStatus(e.message);card.disabled=false;}finally{operations--;}};grid.append(card);}view.append(grid);}
 async function confirm(){if(closing)return;if(operations){setStatus('Aguarde a alteração terminar antes de confirmar.');return;}closing=true;$('ok').disabled=true;try{const r=await api.ueLiveConfirm();if(!r.ok){closing=false;$('ok').disabled=false;setStatus(r.error||'Não foi possível confirmar.');}}catch(e){closing=false;$('ok').disabled=false;setStatus(e.message);}}
 $('ok').onclick=confirm;$('search').oninput=()=>data&&cheats();document.addEventListener('keydown',e=>{if(e.key==='Escape'||(e.ctrlKey&&e.key.toLowerCase()==='k')){e.preventDefault();if(!e.repeat)confirm();}});
 function targets(){return [...document.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')].filter(e=>e.offsetParent!==null);}
 function move(delta){const list=targets();if(!list.length)return;let index=list.indexOf(document.activeElement);const target=list[(Math.max(index,0)+delta+list.length)%list.length];target.focus();target.scrollIntoView({block:'nearest'});if(target.classList.contains('filter'))filter(target.dataset.value);}
 setInterval(()=>{if(!data||closing)return;const pad=[...(navigator.getGamepads?.()||[])].find(p=>p&&p.connected);if(!pad)return;const buttons=pad.buttons.map(b=>Boolean(b?.pressed||Number(b?.value||0)>.55)),x=Number(pad.axes?.[0]||0),y=Number(pad.axes?.[1]||0);if(!neutral){if(!buttons.some(Boolean)&&Math.abs(x)<.4&&Math.abs(y)<.4){neutral=true;previous=buttons;}return;}const edge=i=>buttons[i]&&!previous[i],now=Date.now();if(now-lastMove>220){if(edge(12)||edge(14)||y<-.6||x<-.6){move(-1);lastMove=now;}else if(edge(13)||edge(15)||y>.6||x>.6){move(1);lastMove=now;}}if(edge(0))document.activeElement?.click();if(edge(1))confirm();previous=buttons;},70);
 api.ueLiveInfo().then(r=>{if(!r.ok){setStatus(r.error);return;}data=r;selectedFilter=r.selected;$('title').textContent=r.title+' · filtros e cheats';for(const preset of r.filters){const b=document.createElement('button');b.type='button';b.className='filter';b.dataset.value=preset.value;b.textContent=preset.label;b.onclick=()=>filter(preset.value);$('filters').append(b);}markFilter();cheats();if(r.kind==='mame')$('note').textContent='Efeitos nativos do MAME. Alterações visíveis imediatamente.';showTab('filters');setStatus('Selecione um filtro ou ative os cheats deste jogo.');$('filters').querySelector('.active')?.focus();}).catch(e=>setStatus(e.message));
})();
</script></body></html>
