<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cheater — Ultimate Emulator</title><style>
*{box-sizing:border-box}body{margin:0;background:#191622;color:#f2eef8;font:14px Segoe UI,Arial}header{position:sticky;top:0;background:#252033;padding:22px;border-bottom:1px solid #514365}h1{font-size:21px;margin:0 0 8px}small{color:#c2b5d2;line-height:1.5}input[type=search]{width:100%;margin-top:15px;padding:11px;background:#17131e;border:1px solid #67577b;border-radius:9px;color:white}main{padding:15px;display:grid;gap:8px}article{border:1px solid #463b52;border-radius:10px;padding:12px;background:#241e30}label{display:flex;align-items:center;gap:12px;cursor:pointer}input[type=checkbox]{width:20px;height:20px;accent-color:#a876ed}details{margin:7px 0 0 32px;color:#aaa0b6;font-size:11px}footer{position:sticky;bottom:0;padding:15px;background:#252033;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{color:white;background:#684097;border:1px solid #9570bd;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{flex-basis:100%;font-size:12px;color:#d0b5f4;min-height:22px}#empty{padding:20px;line-height:1.6;color:#cbbadf}#meta{display:block}#source{display:block;max-height:70px;overflow:auto;margin-top:8px}#count{margin-top:8px;display:block}pre{white-space:pre-wrap}</style></head><body>
<header><h1 id="title">Cheater</h1><small id="meta"></small><small id="source"></small><input id="search" type="search" placeholder="Search health, lives, ammo, time…"><small id="count"></small></header><main id="items"></main><footer><button id="play">Start this game</button><button id="disable-all">Desativar todos</button><button id="refresh">Refresh</button><button id="close">Close</button><div id="status" role="status">Loading…</div></footer>
<script>
const api=window.electronAPI,items=document.getElementById('items'),status=document.getElementById('status');let data=null,busy=false;const variants=new Map();
async function submit(c,request){if(busy)return;busy=true;status.textContent='Aplicando alteração no emulador… aguarde a confirmação.';const progressTimer=setInterval(()=>api.ue159Info().then(r=>{if(busy&&r.progress)status.textContent=r.progress+' · aguarde a confirmação.'}).catch(()=>{}),700);render();try{const r=await api.ue159Toggle(c.index,request);if(r.ok){c.enabled=r.enabled;if(r.value!==undefined)c.value=r.value;status.textContent=r.message;}else status.textContent=r.error||'Change was not confirmed.';}catch(e){status.textContent=e.message;}finally{clearInterval(progressTimer);busy=false;render();}}
function render(){
 items.replaceChildren();const q=document.getElementById('search').value.toLowerCase();const entries=data?.entries||[];let count=0;
 const groups=new Map();for(const entry of entries){const key=entry.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(entry);}
 for(const [key,group] of groups){
  if(!group.some(c=>(c.name+' '+(c.original||'')).toLowerCase().includes(q)))continue;count++;
  const c=group.find(c=>c.index===variants.get(key))||group.find(c=>c.enabled)||group[0];
  const row=document.createElement('article'),label=document.createElement('label'),check=document.createElement('input'),name=document.createElement('span');
  check.type='checkbox';check.checked=!!c.enabled;check.disabled=busy||!c.actionable;name.textContent=c.name||'Information';
  if(!c.oneshot)label.append(check);label.append(name);row.append(label);
  if(group.length>1){const select=document.createElement('select');select.style.cssText='display:block;margin:10px 0 0 32px;max-width:90%;padding:8px;background:#17131e;color:white;border:1px solid #67577b;border-radius:7px';for(const [i,v] of group.entries()){const option=document.createElement('option');option.value=v.index;option.textContent='Variante '+(i+1)+(v.enabled?' · ativa':'');select.append(option);}select.value=c.index;select.disabled=busy;select.onchange=()=>{variants.set(key,Number(select.value));render()};row.append(select);}
  let valueControl=null;
  if(c.parameter){
   const values=c.parameter.item?Object.values(c.parameter.item):null;
   valueControl=document.createElement(values?'select':'input');
   if(values){for(const v of values){const option=document.createElement('option');option.value=v.value;option.textContent=v.text;valueControl.append(option);}}
   else{valueControl.type='number';valueControl.min=c.parameter.min;valueControl.max=c.parameter.max;valueControl.step=c.parameter.step||1;}
   valueControl.value=c.value??values?.[0]?.value??c.parameter.min;valueControl.disabled=busy;valueControl.style.cssText='margin:8px 0 0 32px;padding:8px;max-width:90%';row.append(valueControl);
   valueControl.onchange=()=>{c.value=Number(valueControl.value);if(c.enabled&&!c.oneshot)submit(c,{enabled:true,value:c.value});};
  }
  if(c.oneshot){const button=document.createElement('button');button.textContent='Apply once';button.disabled=busy||!c.actionable;button.onclick=()=>submit(c,{enabled:true,value:valueControl?Number(valueControl.value):undefined});row.append(button);}
  if(c.original&&c.original!==c.name){const details=document.createElement('details'),summary=document.createElement('summary'),text=document.createElement('div');summary.textContent='Original database label';text.textContent=c.original;details.append(summary,text);row.append(details);}
  if(!c.actionable){const note=document.createElement('small');note.textContent='Information / code group';row.append(note);}
  check.onchange=()=>submit(c,c.parameter?{enabled:check.checked,value:Number(valueControl.value)}:check.checked);items.append(row);
 }
 document.getElementById('count').textContent=count+' cheats'+(entries.length>groups.size?' · variantes agrupadas':'');
 if(!entries.length){const empty=document.createElement('div');empty.id='empty';empty.textContent=data?.reason||'No matching cheats in the installed database.';items.append(empty);}
 document.getElementById('play').style.display=data?.live?'none':'';
}
async function refresh(){const r=await api.ue159Info();if(!r.ok){status.textContent=r.error;return;}data=r;document.getElementById('title').textContent=r.title;document.getElementById('meta').textContent=r.region+(r.revision?' · Revision: '+r.revision:'')+' · '+(r.live?(r.loaded?'Connected to the running game':'Waiting for game cheat-file confirmation'):'Saved selections apply on next launch');document.getElementById('source').textContent=r.source;status.textContent=r.reason||'Select a cheat. Live changes require emulator acknowledgement.';render();}
document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=refresh;document.getElementById('disable-all').onclick=async()=>{if(busy)return;busy=true;const button=document.getElementById('disable-all');button.disabled=true;status.textContent='Desativando todos os cheats…';render();try{const r=await api.ue159DisableAll();status.textContent=r.ok?(r.message||`${r.disabled||0} cheats desativados.`):(r.error||'Não foi possível desativar os cheats.');if(r.ok)await refresh();}catch(e){status.textContent=e.message;}finally{busy=false;button.disabled=false;render();}};document.getElementById('play').onclick=async()=>{document.getElementById('play').disabled=true;status.textContent='Closing previous game and starting this game…';try{const r=await api.ue20CheatsPlay();if(!r.ok)status.textContent=r.error;else{await new Promise(r=>setTimeout(r,1200));await refresh();}}catch(e){status.textContent=e.message;}finally{document.getElementById('play').disabled=false;}};document.getElementById('close').onclick=()=>api.ue159Close();document.addEventListener('keydown',e=>{if(e.key==='Escape')api.ue159Close()});refresh().catch(e=>status.textContent=e.message);
</script></body></html>
